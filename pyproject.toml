[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "queuemo"
version = "1.27.5"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    # "bibliography>=0.3.4,<1.0.0",
    "capita>=1.23.2,<2.0.0",
    # "caption>=0.4.5,<1.0.0",
    "mundare>=1.0.2,<2.0.0",
    # "codero>=0.6.2,<1.0.0",
    "configos>=1.0.4,<2.0.0",
    # "decider>=3.4.1,<4.0.0",
    # "decider_con>=0.12.0,<1.0.0",
    # "decider_lay>=0.13.3,<1.0.0",
    # "decider_ref>=1.23.0,<2.0.0",
    # "feedback>=1.15.5,<2.0.0",
    # "figureo>=0.18.5,<1.0.0",
    "flask>=2.2.2,<3.0.0",
    # "formulero>=0.7.1,<1.0.0",
    "groupmes>=1.1.0,<2.0.0",
    # "headlines>=0.12.2,<1.0.0",
    "headnote>=1.0.3,<2.0.0",
    # "hey>=5.20.3,<6.0.0",
    "ibidem>=1.0.2,<2.0.0",
    "indagator>=1.0.1,<2.0.0",
    "analp>=1.0.0,<2.0.0",
    "layouta>=1.0.0,<2.0.0",
    "qvlink>=2.15.7,<3.0.0",
    # "lists>=0.3.3,<1.0.0",
    "pagenumber>=1.0.0,<2.0.0",
    "pdflog>=1.0.2,<2.0.0",
    # "qcon>=0.8.2,<1.0.0",
    "rawmaker>=2.40.5,<3.0.0",
    "reftable>=1.0.0,<2.0.0",
    # "smarty>=1.6.2,<2.0.0",
    # "tablero>=0.10.4,<1.0.0",
    # "texas>=0.15.2,<1.0.0",
    "ughost>=1.0.1,<2.0.0",
    "utilo>=2.109.1,<3.0.0",
    # "words>=1.23.3,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "gennex==1.0.3",
    "hoverpower==1.5.1",
    "utilotest==1.0.4",
]

[project.urls]
Homepage = "https://github.com/anaticulae/queuemo"
Repository = "https://github.com/anaticulae/queuemo"

[project.scripts]
queuemo = "queuemo.cli.main:main"
queuemo_single = "queuemo.cli.single:main"
queuemo_state = "queuemo.cli.state:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "queuemo",
    "queuemo.cli",
    "queuemo.recipes",
    "queuemo.recipes.fastview",
    "queuemo.recipes.publish",
    "queuemo.recipes.result",
    "queuemo.recipes.validation",
    "queuemo.runtime",
    "queuemo.worker",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "HOME",
    "MASTER",
    "ORDER",
    "PAPER",
]
